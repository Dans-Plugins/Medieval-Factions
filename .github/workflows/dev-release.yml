name: Dev Release

# Publishes a rolling prerelease of the main branch so that server operators can opt into
# unreleased changes via Dan's Plugin Manager (`/dpm get medievalfactions --experimental`).
#
# The build steps deliberately mirror release.yml — if the release build changes, change it here too.

on:
  push:
    branches: [ main ]
    # A documentation-only merge produces an identical JAR, so it is not worth a new prerelease
    # (and the release notification it sends to every watcher of this repository).
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

# The publish step deletes and recreates the release, so two runs must never overlap.
# Queue instead of cancelling: a cancelled run could leave the repository with no dev release at all.
concurrency:
  group: dev-release
  cancel-in-progress: false

jobs:
  dev-release:
    runs-on: ubuntu-latest
    # Forks have neither the release to publish to nor a reason to publish one.
    if: github.repository == 'Dans-Plugins/Medieval-Factions'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Ponder dependency
        run: |
          git clone https://github.com/Dans-Plugins/Ponder.git /tmp/Ponder
          cd /tmp/Ponder
          git checkout 2.0.0
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Shadow JAR with Gradle
        run: ./gradlew clean shadowJar

      - name: Republish the dev prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Dan's Plugin Manager installs the first .jar asset it finds on the release, so publishing
          # more than one would leave the installed build depending on asset order. An empty or
          # ambiguous match fails the run rather than publishing something unpredictable.
          jars=(build/libs/*-all.jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "Expected exactly one JAR to publish, found ${#jars[@]}: ${jars[*]:-none}" >&2
            exit 1
          fi

          # The dev tag has to move to the new commit. Editing a published release does not move its
          # tag, so the release and its tag are deleted and recreated. That leaves a window with no
          # dev release, and a transient API failure inside it would strand the repository there
          # until someone noticed by hand — which has happened. Each attempt therefore starts from a
          # clean slate, so a half-finished attempt cannot wedge the next one.
          published=
          for attempt in 1 2 3; do
            if [ -n "${attempt_delay:-}" ]; then sleep "$attempt_delay"; fi
            attempt_delay=$((attempt * 15))

            gh release delete dev --yes --cleanup-tag || true

            if gh release create dev \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Development build" \
              --notes "Automated build of \`main\` at ${GITHUB_SHA}.

          **This is not a release.** It is unreleased, unreviewed code that has not been through any
          release check, and a broken build can stop a server from starting. Do not run it on a server
          you care about without a backup.

          Install it with Dan's Plugin Manager:

          \`\`\`
          /dpm get medievalfactions --experimental
          \`\`\`

          Return to published releases with \`/dpm get medievalfactions --stable\`." \
              "${jars[0]}"; then
              published=1
              break
            fi

            echo "Publishing the dev prerelease failed (attempt $attempt of 3)." >&2
          done

          if [ -z "$published" ]; then
            echo "Could not publish the dev prerelease after 3 attempts. The dev release may be missing until this workflow is re-run." >&2
            exit 1
          fi
