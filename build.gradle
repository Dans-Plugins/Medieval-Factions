plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.7.0'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'nu.studer.jooq' version '7.1.1'
    id 'org.jmailen.kotlinter' version '3.12.0'
}

group = "com.dansplugins"
version = "6.0.1-SNAPSHOT"

def repoUsername = ""
def repoPassword = ""
def propertiesFile = new File("repo.properties")
if (propertiesFile.exists()) {
    def properties = new Properties()
    properties.load(new FileInputStream(propertiesFile))
    repoUsername = properties.getProperty("username")
    repoPassword = properties.getProperty("password")
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/public/' }
    maven { url 'https://oss.sonatype.org/content/groups/public/' }
    maven { url 'https://repo.mikeprimm.com/' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url 'https://repo.maven.apache.org/maven2/' }
    maven { url 'https://repo.rpkit.com/repository/maven-public/' }
    maven {
        url 'https://jitpack.io'
        content {
            includeGroupByRegex 'com\\.github\\..*'
        }
    }
}

configurations {
    flywayMigration
}

dependencies {
    implementation 'me.clip:placeholderapi:2.11.6'
    implementation 'org.spigotmc:spigot-api:1.21.11-R0.1-SNAPSHOT'
    implementation 'us.dynmap:dynmap-api:2.2'
    implementation 'org.bstats:bstats-bukkit:3.0.0'
    implementation platform("dev.forkhandles:forkhandles-bom:2.2.0.0")
    implementation 'dev.forkhandles:result4k'
    implementation 'org.jooq:jooq:3.17.4'
    implementation 'org.flywaydb:flyway-core:9.4.0'
    implementation 'org.flywaydb:flyway-mysql:9.4.0'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.0.6'
    implementation 'com.h2database:h2:2.1.214'
    implementation 'com.zaxxer:HikariCP:5.0.1'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.github.everit-org.json-schema:org.everit.json.schema:1.14.2' // JSON schema validation
    // 2.0.7 is what the build actually resolves: Javalin/Jetty pull slf4j-api 2.0.x
    // and it wins over the 1.8.0-beta4 that used to be declared here. Declaring it
    // explicitly keeps the file honest about the version MfSlf4jServiceProvider is
    // written against.
    implementation 'org.slf4j:slf4j-api:2.0.7'
    implementation 'com.github.Dans-Plugins:Mailboxes:v1.1'
    implementation 'com.rpkit:rpk-core-bukkit:2.3.2:all'
    implementation 'com.rpkit:rpk-player-lib-bukkit:2.3.2:all'
    implementation 'com.rpkit:rpk-notification-lib-bukkit:2.3.2:all'
    implementation 'com.rpkit:rpk-lock-lib-bukkit:2.3.2:all'
    implementation 'io.javalin:javalin:5.6.3'
    // No SLF4J binding is added here on purpose. Javalin logs through SLF4J, and
    // MfSlf4jServiceProvider already routes SLF4J into the Bukkit plugin logger.
    // Adding slf4j-simple would both duplicate the binding and pull slf4j-api 2.0.x,
    // whose SLF4JServiceProvider renamed getRequesteApiVersion (a typo in 1.8.0-beta4)
    // to getRequestedApiVersion, which breaks that provider.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.3'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.15.3'
    jooqGenerator 'org.jooq:jooq-meta-extensions:3.17.4'

    // Use the Kotlin JUnit 5 integration.
    testImplementation("org.jetbrains.kotlin:kotlin-test-junit5")
    testImplementation("org.mockito:mockito-core:4.0.0")
    testImplementation("org.mockito:mockito-inline:4.0.0")
    testImplementation("au.com.dius.pact.consumer:junit5:4.6.7")

    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

kotlin {
    jvmToolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('check') {
    dependsOn 'installKotlinterPrePushHook'
}

jooq {
    configurations {
        main {
            generationTool {
                logging = 'WARN'
                generator {
                    name = 'org.jooq.codegen.DefaultGenerator'
                    database {
                        name = 'org.jooq.meta.extensions.ddl.DDLDatabase'
                        inputSchema = 'PUBLIC'
                        includes = '.*'
                        excludes = ''
                        properties {
                            property {
                                key = "scripts"
                                value = "src/main/resources/com/dansplugins/factionsystem/db/migration"
                            }
                            property {
                                key = "sort"
                                value = "semantic"
                            }
                            property {
                                key = "defaultNameCase"
                                value = "lower"
                            }
                        }
                    }
                    target {
                        packageName = 'com.dansplugins.factionsystem.jooq'
                    }
                }
            }
        }
    }
}

import org.apache.tools.ant.filters.ReplaceTokens

processResources {
    filter ReplaceTokens, tokens: [
            'version': version
    ]
}

shadowJar {
    // jackson-core 2.15.x is a multi-release jar carrying Java 19 (class file major
    // version 63) copies of its FastDoubleParser under META-INF/versions/19. Shadow
    // 7.1.2 bundles an ASM that cannot read them and fails the task outright. The
    // versioned copies are a parsing optimisation only; the base implementation under
    // the normal package is kept, so excluding them costs nothing at runtime.
    exclude 'META-INF/versions/**'

    archiveClassifier.set('all')
    mergeServiceFiles()
    dependencies {
        include(dependency('org.jetbrains.kotlin:kotlin-stdlib-jdk8'))
        include(dependency('org.jetbrains.kotlin:kotlin-stdlib'))
        include(dependency('org.jetbrains.kotlin:kotlin-stdlib-common'))
        include(dependency('org.jetbrains:annotations'))
        include(dependency('org.jetbrains.kotlin:kotlin-stdlib-jdk7'))
        include(dependency('org.bstats:bstats-bukkit'))
        include(dependency('org.bstats:bstats-base'))
        include(dependency('dev.forkhandles:result4k'))
        include(dependency('org.jooq:jooq'))
        include(dependency('io.r2dbc:r2dbc-spi'))
        include(dependency('org.reactivestreams:reactive-streams'))
        include(dependency('jakarta.xml.bind:jakarta.xml.bind-api'))
        include(dependency('com.sun.activation:jakarta.activation'))
        include(dependency('org.flywaydb:flyway-core'))
        include(dependency('org.flywaydb:flyway-mysql'))
        include(dependency('org.mariadb.jdbc:mariadb-java-client'))
        include(dependency('com.h2database:h2'))
        include(dependency('com.zaxxer:HikariCP'))
        include(dependency('com.google.code.gson:gson'))
        include(dependency('io.javalin:javalin'))
        include(dependency('org.eclipse.jetty:jetty-server'))
        include(dependency('org.eclipse.jetty:jetty-webapp'))
        include(dependency('org.eclipse.jetty.websocket:websocket-jetty-server'))
        include(dependency('org.eclipse.jetty.websocket:websocket-jetty-api'))
        include(dependency('org.eclipse.jetty.websocket:websocket-servlet'))
        include(dependency('com.fasterxml.jackson.core:jackson-databind'))
        include(dependency('com.fasterxml.jackson.core:jackson-core'))
        include(dependency('com.fasterxml.jackson.core:jackson-annotations'))
        include(dependency('com.fasterxml.jackson.module:jackson-module-kotlin'))
        // everit's own transitive dependencies (commons-validator, handy-uri-templates) are deliberately
        // not shaded in: they are only reached by the "format" keyword validators for email/hostname/ip/
        // uri-template, which the schemas under src/main/resources/schemas do not use. Adding one of those
        // formats to a schema would fail at runtime with NoClassDefFoundError until the corresponding
        // dependency is included here.
        include(dependency('com.github.everit-org.json-schema:org.everit.json.schema'))
        include(dependency('org.json:json'))
    }

    relocate 'com.google', 'com.dansplugins.factionsystem.shadow.com.google'
    relocate 'org.mariadb', 'com.dansplugins.factionsystem.shadow.org.mariadb'
    relocate 'com.sun', 'com.dansplugins.factionsystem.shadow.com.sun'
    relocate 'com.zaxxer', 'com.dansplugins.factionsystem.shadow.com.zaxxer'
    relocate 'dev.forkhandles', 'com.dansplugins.factionsystem.shadow.dev.forkhandles'
    relocate 'google', 'com.dansplugins.factionsystem.shadow.google'
    relocate 'io.r2dbc', 'com.dansplugins.factionsystem.shadow.io.r2dbc'
    relocate 'jakarta', 'com.dansplugins.factionsystem.shadow.jakarta'
    relocate 'kotlin', 'com.dansplugins.factionsystem.shadow.kotlin'
    relocate 'org.bstats', 'com.dansplugins.factionsystem.shadow.org.bstats'
    relocate 'org.flywaydb', 'com.dansplugins.factionsystem.shadow.org.flywaydb'
    relocate 'org.h2', 'com.dansplugins.factionsystem.shadow.org.h2'
    relocate 'org.intellij', 'com.dansplugins.factionsystem.shadow.org.intellij'
    relocate 'org.jetbrains', 'com.dansplugins.factionsystem.shadow.org.jetbrains'
    relocate 'org.jooq', 'com.dansplugins.factionsystem.shadow.org.jooq'
    relocate 'org.reactivestreams', 'com.dansplugins.factionsystem.shadow.org.reactivestreams'
    relocate 'org.everit', 'com.dansplugins.factionsystem.shadow.org.everit'
    relocate 'org.json', 'com.dansplugins.factionsystem.shadow.org.json'
    relocate 'io.javalin', 'com.dansplugins.factionsystem.shadow.io.javalin'
    relocate 'org.eclipse.jetty', 'com.dansplugins.factionsystem.shadow.org.eclipse.jetty'
    relocate 'com.fasterxml.jackson', 'com.dansplugins.factionsystem.shadow.com.fasterxml.jackson'
}

artifacts {
    archives shadowJar
}

publishing {
    repositories {
        maven {
            credentials {
                username repoUsername
                password repoPassword
            }
            def releasesRepoUrl = "https://repo.dansplugins.com/repository/maven-releases/"
            def snapshotsRepoUrl = "https://repo.dansplugins.com/repository/maven-snapshots/"
            url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
        }
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Dans-Plugins/Medieval-Factions")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
    publications {
        maven(MavenPublication) { publication ->
            groupId = project.group
            artifactId = project.name
            version = project.version

            artifact(shadowJar)
        }
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
    systemProperty 'pact.rootDir', "${projectDir}/pacts"
}
